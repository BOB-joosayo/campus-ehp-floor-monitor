<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>A대학 B관 EHP 아이콘 상태 견본 (개발 확인용)</title>
<link rel="stylesheet" href="assets/ehp-viz.css?v=20261124v">
<style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
<div class="ehp-viz">
  <div class="ev-top"><div class="ev-title">아이콘 상태 견본</div><div class="ev-time">개발 확인용, 고객 화면 아님</div></div>
  <div class="gal" id="gal"></div>
</div>
<script src="data/point-map.js?v=20261124v"></script>
<script src="assets/ehp-viz.js?v=20261124v"></script>
<script>
(function () {
  const V = window.EhpViz;
  const DEFS = `<defs><pattern id="ev-hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="4" height="4" fill="#18181c"/><rect width="1.6" height="4" fill="#4a4a52"/></pattern></defs>`;
  const IU = [
    ["iu-heat", "iu on st-heat", "난방 운전", "빨간 물결 3줄이 흘러내림"],
    ["iu-cool", "iu on st-cool", "냉방 운전", "파란 화살표, 눈꽃 배지 회전"],
    ["iu-fan", "iu on st-fan", "송풍 운전", "초록 곡선 바람이 퍼짐"],
    ["iu-dry", "iu on st-dry", "제습 운전", "짧은 선, 물방울 배지가 맺혔다 떨어짐"],
    ["iu-auto", "iu on st-auto", "자동 운전", "보라 곡선 바람, AUTO 표시 깜박"],
    ["iu-off", "iu st-off", "정지", "회색, 움직임 없음"],
    ["iu-comm", "iu st-comm", "통신 없음", "본체 빗금"],
    ["iu-none", "iu st-none", "정보 없음 (ON/OFF = -1)", "본체 점선 테두리"],
    ["iu-hover", "iu on st-heat hover", "마우스 올림", "2.1배 확대, 빛 번짐"],
    ["iu-sel", "iu on st-heat sel", "선택", "1.9배 확대, 흰 점선 테두리 회전"],
  ];
  const OD = [
    ["od-heat", "od-mk on st-heat", "실외기 운전 (난방)", "프로펠러 회전, 빨강"],
    ["od-cool", "od-mk on st-cool", "실외기 운전 (냉방)", "프로펠러 회전, 파랑"],
    ["od-stop", "od-mk st-stop", "실외기 정지", "회색, 프로펠러 멈춤"],
    ["od-comm", "od-mk st-comm", "실외기 통신 없음", "함체 빗금"],
    ["od-hover", "od-mk on st-heat hover", "마우스 올림", "2.1배 확대"],
    ["od-sel", "od-mk on st-heat sel", "선택", "1.9배 확대, 흰 점선 테두리"],
  ];
  const FAN = [
    ["fan-1", "iu on st-heat", "풍량 강", "1.0초 주기 x 0.9", 1.0],
    ["fan-2", "iu on st-heat", "풍량 중", "1.6초 주기 x 0.9", 1.6],
    ["fan-3", "iu on st-heat", "풍량 약", "2.4초 주기 x 0.9", 2.4],
    ["fan-4", "iu on st-heat", "풍량 터보", "0.6초 주기 x 0.9", 0.6],
  ];
  // 확대(마우스 올림, 선택) 칸만 넓게, 나머지는 아이콘에 가깝게 찍는다
  const cell = (id, cls, title, note, glyph, style) =>
    `<div class="gal-cell" id="${id}"><svg viewBox="${/hover|sel/.test(cls) ? "-38 -34 76 68" : "-21 -18 42 32"}">${DEFS}<g class="${cls}" style="${style || ""}"><g class="gl">${glyph}</g></g></svg>
     <b>${title}</b><small>${note}</small></div>`;
  document.getElementById("gal").innerHTML =
    `<h2>실내기</h2><div class="gal-row">${IU.map(([id, c, t, n]) => cell(id, c, t, n, V.iuGlyph(), "--flow:1.4s")).join("")}</div>` +
    `<h2>실내기 풍량별 바람 빠르기</h2><div class="gal-row">${FAN.map(([id, c, t, n, s]) => cell(id, c, t, n, V.iuGlyph(), `--flow:${s * 0.9}s`)).join("")}</div>` +
    `<h2>실외기</h2><div class="gal-row">${OD.map(([id, c, t, n]) => cell(id, c, t, n, V.odGlyph(), "--spin:1s")).join("")}</div>`;
})();
</script>
</body>
</html>
